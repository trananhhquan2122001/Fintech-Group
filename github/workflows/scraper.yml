name: Financial Data Scraper Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Tự động chạy mỗi ngày vào lúc 00:00 UTC
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên GitHub bất cứ lúc nào

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg2-binary beautifulsoup4

      - name: Run Python Scraper Script
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python main.py
