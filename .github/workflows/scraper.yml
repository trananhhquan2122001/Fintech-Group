name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    # Lịch chạy định kỳ (Ví dụ: 9:15 UTC hàng ngày)
    - cron: '15 9 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas requests yfinance openpyxl huggingface_hub

      - name: Run Pro Scraper Script
        run: |
          python main.py

      - name: Commit and push changes to GitHub (Optional Backup)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          
          git add vietnam_stock_database.xlsx data/vietnam_stock_database_tong_hop.csv || true
          
          git status
          git diff --staged --quiet || git commit -m "Auto-update FINEX dataset [skip ci]"
          
          git push origin main

      - name: Push Data Directly to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          
          # Đẩy file Excel hoặc file CSV tổng hợp lên Hugging Face Space của bạn
          api.upload_file(
              path_or_file='vietnam_stock_database.xlsx',
              path_in_repo='data/vietnam_stock_database.xlsx',
              repo_id='trananhquan2001/trananhquan-terminal',
              repo_type='space',
              token='${{ secrets.HF_TOKEN }}'
          )
          print('Đã đẩy dữ liệu lên Hugging Face Space thành công!')
          "
