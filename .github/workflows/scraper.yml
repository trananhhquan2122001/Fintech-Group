name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas requests yfinance openpyxl huggingface_hub supabase numpy
          pip install --no-cache-dir --extra-index-url https://vnstocks.com/api/packages vnstock
          pip install --no-cache-dir vnfinancialdata

      # BƯỚC 1: CHẠY CRAWLER
      - name: Run FINEX Engine
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python main.py

      # BƯỚC 2: LÀM SẠCH & ĐỒNG BỘ SUPABASE (FIX LỖI CỘT DATE)
      - name: Clean Data & Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os
          import pandas as pd
          import numpy as np
          from datetime import datetime
          from supabase import create_client

          print('--- BƯỚC 2: LÀM SẠCH VÀ ĐỒNG BỘ SUPABASE ---')
          file_path = 'data/vietnam_stock_database_tong_hop.csv'
          if not os.path.exists(file_path):
              raise FileNotFoundError(f'Không tìm thấy file {file_path}')

          df = pd.read_csv(file_path)
          df = df.replace([np.inf, -np.inf], np.nan)

          rename_map = {
              'Mã chứng khoán': 'ticker',
              'Tên doanh nghiệp': 'company_name',
              'Tên ngành': 'sector',
              'Loại báo cáo': 'report_type',
              'Loại kỳ': 'period_type',
              'Năm': 'year',
              'Ngày kỳ': 'report_date',
              'Chỉ tiêu tiếng Việt': 'item_vn',
              'Giá trị': 'value'
          }
          df = df.rename(columns=rename_map)

          df = df.dropna(subset=['ticker', 'value'])
          df['ticker'] = df['ticker'].astype(str).str.strip().str.upper()
          df = df[df['ticker'] != 'NAN']
          
          df['value'] = pd.to_numeric(df['value'], errors='coerce')
          df = df[df['value'].notna() & (df['value'] != 0)]
          df['year'] = pd.to_numeric(df['year'], errors='coerce').fillna(datetime.now().year).astype(int)

          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])

          # 3. LẤY DANH SÁCH CỘT THỰC TẾ TỪ SUPABASE
          try:
              res = supabase.table('finex_stock_master').select('*').limit(1).execute()
              if res.data:
                  valid_cols = set(res.data[0].keys())
              else:
                  valid_cols = {'ticker', 'company_name', 'sector', 'report_type', 'period_type', 'year', 'report_date', 'item_vn', 'value', 'extra_metrics', 'date'}
          except Exception as e:
              print(f'Không lấy được schema, dùng mặc định: {e}')
              valid_cols = {'ticker', 'company_name', 'sector', 'report_type', 'period_type', 'year', 'report_date', 'item_vn', 'value', 'extra_metrics', 'date'}

          records = []
          for _, row in df.iterrows():
              def clean_str(s):
                  return str(s).strip() if pd.notna(s) else None
                  
              r = {
                  'ticker': str(row['ticker']),
                  'company_name': clean_str(row.get('company_name')),
                  'sector': clean_str(row.get('sector')),
                  'report_type': clean_str(row.get('report_type')),
                  'period_type': clean_str(row.get('period_type')),
                  'year': int(row['year']),
                  'report_date': clean_str(row.get('report_date')),
                  'item_vn': clean_str(row.get('item_vn')),
                  'value': float(row['value'])
              }
              
              final_r = {}
              extra = {}
              for k, v in r.items():
                  if k in valid_cols:
                      final_r[k] = v
                  else:
                      extra[k] = v
                      
              if 'extra_metrics' in valid_cols:
                  final_r['extra_metrics'] = extra if extra else {}

              # 🚀 FIX CHÍ MẠNG: Xử lý cột 'date' bị NOT NULL từ schema cũ
              if 'date' in valid_cols:
                  # Gán date = report_date (hoặc ngày hôm nay nếu report_date trống)
                  final_r['date'] = final_r.get('report_date') or datetime.now().strftime('%Y-%m-%d')
                  
              # Đảm bảo mọi key trong valid_cols đều có mặt để PostgREST không báo lỗi
              for col in valid_cols:
                  if col not in final_r and col not in ['extra_metrics', 'created_at']:
                      final_r[col] = None
                      
              records.append(final_r)

          print(f'Đang đồng bộ {len(records)} bản ghi sạch vào bảng finex_stock_master...')
          
          batch_size = 500
          for i in range(0, len(records), batch_size):
              batch = records[i:i + batch_size]
              supabase.table('finex_stock_master').upsert(
                  batch, 
                  on_conflict='ticker,report_type,period_type,report_date,item_vn'
              ).execute()
              print(f' ✅ Đã đẩy {min(i+batch_size, len(records))}/{len(records)} bản ghi...')

          print('🎉 Đồng bộ Supabase thành công 100%!')
          "

      # BƯỚC 3: LƯU FILE LÊN GITHUB
      - name: Commit and push changes to GitHub (Backup CSV)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          git add data/vietnam_stock_database_tong_hop.csv || true
          git diff --staged --quiet || git commit -m "Auto-update FINEX Master Dataset (Cleaned) [skip ci]"
          git push origin main

      # BƯỚC 4: LƯU FILE VÀO HUGGING FACE
      - name: Push Cleaned Dataset to Hugging Face Space Repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          
          api = HfApi()
          space_repo_id = 'trananhquan2001/trananhquan-terminal'
          local_file_path = 'data/vietnam_stock_database_tong_hop.csv'
          remote_file_path = 'du_lieu/dulieu_hang_ngay.csv'
          
          print(f'Đang upload file đã làm sạch trực tiếp vào Space: {space_repo_id}...')
          api.upload_file(
              path_or_fileobj=local_file_path,
              path_in_repo=remote_file_path,
              repo_id=space_repo_id,
              repo_type='space',
              token=os.environ['HF_TOKEN']
          )
          print('Đã đẩy file sạch trực tiếp vào Space thành công!')
          "
