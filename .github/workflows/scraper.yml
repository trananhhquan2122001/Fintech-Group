# ============================================================================
# Financial Data Scraper Pipeline — v21.6 (AUTO VN-INDEX OHLCV + FIX cloudscraper + HEAD~1 + pandas 3)
# ============================================================================
# ✅ FIX 1: cloudscraper>=1.2.72 KHÔNG TỒN TẠI trên PyPI -> chốt ==1.2.71 (bản cao nhất)
# ✅ FIX 2: exit 128 "HEAD~1 unknown revision" -> fetch-depth: 0 + guard rev-parse
#           + bỏ git-auto-commit-action, dùng git thuần (chỉ commit đúng 2 file)
# ✅ FIX 3: chặn pandas 3.x (<3) + numpy <2.3 để đúng tuyến code đã kiểm chứng
# ✅ FIX 4: Supabase sync batch 800 -> 200 + retry + đổi client (hết ConnectionTerminated)
# ✅ FIX 5: vũ trụ mã lấy trực tiếp từ main.py; quality gate động 95% (122 mã -> tính tự động từ danh sách main.py), báo rõ mã thiếu
# ✅ VN-INDEX: xác thực tối thiểu 20 phiên OHLC thật, không commit nếu dữ liệu quá cũ hoặc thiếu cột.
# ✅ Giữ nguyên: bỏ VNDirect BCTC, quét Quý đa luồng, clean/verify, HF + Supabase
# ============================================================================
name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'   # 00:00 giờ Việt Nam (UTC+7)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      # ✅ checkout@v5 (Node24) + fetch-depth 0 -> HEAD~1 LUÔN tồn tại
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      # ✅ setup-python@v6 (Node24)
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/requirements*.txt

      # ✅ FIX cloudscraper: ==1.2.71 (1.2.72 không tồn tại); chặn pandas 3 / numpy 2.3+
      - name: Install Dependencies
        run: |
          set -e
          python -m pip install --upgrade pip wheel setuptools
          pip install --no-cache-dir \
            "yfinance>=0.2.54" \
            "pandas>=2.2.3,<3" \
            "numpy>=1.26,<2.3" \
            "pyarrow>=16" \
            "httpx[http2]>=0.27" \
            "tenacity>=8.3" \
            "huggingface_hub>=0.30" \
            "supabase>=2.17" \
            "vnfinancialdata>=0.1.2" \
            "openpyxl>=3.1" \
            "tqdm>=4.66" \
            "requests>=2.32" \
            "lxml>=5.0" \
            "beautifulsoup4>=4.12" \
            "cloudscraper==1.2.71"
          echo "📦 Đã cài:"
          pip list | grep -Ei "^(yfinance|pandas|numpy|pyarrow|httpx|supabase|cloudscraper|huggingface-hub|tenacity) "

      # ==========================================
      # 1. Diagnostic nhanh các nguồn
      # ==========================================
      - name: Diagnostic Sources
        run: |
          python -c "
          import yfinance as yf
          from concurrent.futures import ThreadPoolExecutor

          def check_sym(sym):
              try:
                  t = yf.Ticker(sym)
                  q_is = t.quarterly_income_stmt
                  c_is = 0 if q_is is None or getattr(q_is, 'empty', True) else q_is.size
                  return f'✅ {sym}: Q_IS={c_is}'
              except Exception as e:
                  return f'⚠️ {sym}: {type(e).__name__}: {str(e)[:80]}'

          with ThreadPoolExecutor(max_workers=3) as ex:
              for line in ex.map(check_sym, ['FPT.VN', 'ACB.VN', 'VNM.VN']):
                  print(line)
          "

      # ==========================================
      # 2. Chạy FINEX Engine (tắt hẳn VNDirect BCTC)
      # ==========================================
      - name: Run FINEX Engine
        env:
          SKIP_VNDIRECT: "true"
          SKIP_VNDIRECT_BCTC: "true"
          DISABLE_VNDIRECT: "true"
          RUN_VNDIRECT_BCTC: "false"
          PUSH_TO_SUPABASE: "false"
          USE_YFINANCE: "true"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          echo "🚀 Starting FINEX Engine (skip VNDirect BCTC)..."
          timeout 1200 python main.py || {
            code=$?
            echo "⚠️ Engine dừng với mã thoát: $code"
            exit 1
          }
          echo "✅ FINEX Engine finished."

      # ==========================================
      # 2b. Quét dữ liệu Quý đa luồng
      # ==========================================
      - name: Fetch Quarterly Statements (Multi-threaded)
        run: |
          set -e
          python << 'PYEOF'
          import os, glob, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import pandas as pd
          import numpy as np
          import yfinance as yf

          t0 = time.time()
          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          if not os.path.exists(csv_path):
              raise FileNotFoundError(f'Không tìm thấy {csv_path}')

          df = pd.read_csv(csv_path, low_memory=False)
          cols = list(df.columns)

          import re
          with open('main.py', 'r', encoding='utf-8') as f:
              main_source = f.read()
          ticker_match = re.search(r'(?ms)^\s*raw_tickers\s*=\s*\[(.*?)^\s*\]', main_source)
          if not ticker_match:
              raise RuntimeError('Không đọc được danh sách raw_tickers từ main.py')
          ticker_set = set(re.findall(r"['\"]([A-Z0-9]+)['\"]", ticker_match.group(1)))
          if not ticker_set:
              raise RuntimeError('Danh sách raw_tickers trong main.py rỗng')
          tickers = sorted(ticker_set)
          print(f'🎯 Quét Quý đa luồng cho {len(tickers)} mã trong danh sách chính...')

          meta_map = {}
          if 'Mã chứng khoán' in df.columns:
              for tk, grp in df.groupby(df['Mã chứng khoán'].astype(str).str.strip().str.upper()):
                  comp = grp['Tên doanh nghiệp'].dropna().iloc[0] if 'Tên doanh nghiệp' in grp.columns and not grp['Tên doanh nghiệp'].dropna().empty else ''
                  sec  = grp['Tên ngành'].dropna().iloc[0] if 'Tên ngành' in grp.columns and not grp['Tên ngành'].dropna().empty else ''
                  meta_map[tk] = (comp, sec)

          stmt_specs = [
              ('quarterly_balance_sheet', 'Bảng cân đối kế toán'),
              ('quarterly_income_stmt', 'Báo cáo kết quả kinh doanh'),
              ('quarterly_cashflow', 'Báo cáo lưu chuyển tiền tệ'),
          ]

          def fetch_one_ticker(tk):
              comp, sec = meta_map.get(tk, ('', ''))
              rows = []
              try:
                  yf_tk = yf.Ticker(f'{tk}.VN')
                  for attr, rep_name in stmt_specs:
                      try:
                          tbl = getattr(yf_tk, attr, None)
                      except Exception:
                          continue
                      if tbl is None or getattr(tbl, 'empty', True):
                          continue
                      for col_dt in tbl.columns:
                          dt_obj = pd.to_datetime(col_dt, errors='coerce')
                          if pd.isna(dt_obj):
                              continue
                          q_num = (dt_obj.month - 1) // 3 + 1
                          period_label = f'Quý {q_num}'
                          rep_date_str = dt_obj.strftime('%Y-%m-%d')
                          yr_val = int(dt_obj.year)
                          series = tbl[col_dt].dropna()
                          for item_label, val in series.items():
                              v_num = pd.to_numeric(val, errors='coerce')
                              if pd.isna(v_num) or not np.isfinite(float(v_num)) or float(v_num) == 0.0:
                                  continue
                              row = {c: '' for c in cols}
                              if 'Mã chứng khoán' in row: row['Mã chứng khoán'] = tk
                              if 'Tên doanh nghiệp' in row: row['Tên doanh nghiệp'] = comp
                              if 'Tên ngành' in row: row['Tên ngành'] = sec
                              if 'Loại báo cáo' in row: row['Loại báo cáo'] = rep_name
                              if 'Loại kỳ' in row: row['Loại kỳ'] = period_label
                              if 'Năm' in row: row['Năm'] = yr_val
                              if 'Ngày kỳ' in row: row['Ngày kỳ'] = rep_date_str
                              if 'Chỉ tiêu tiếng Việt' in row: row['Chỉ tiêu tiếng Việt'] = str(item_label).strip()
                              if 'Giá trị' in row: row['Giá trị'] = float(v_num)
                              rows.append(row)
              except Exception as e:
                  print(f'  ⚠️ {tk}: {type(e).__name__}')
              return tk, rows

          q_rows = []
          matched = 0
          done = 0
          errors = 0
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = {pool.submit(fetch_one_ticker, tk): tk for tk in tickers}
              for fut in as_completed(futures, timeout=600):
                  done += 1
                  try:
                      tk, r_list = fut.result(timeout=15)
                      if r_list:
                          matched += 1
                          q_rows.extend(r_list)
                  except Exception:
                      errors += 1
                  if done % 40 == 0 or done == len(tickers):
                      print(f'  ⚡ {done}/{len(tickers)} mã | Có Quý: {matched} | Dòng: {len(q_rows):,} | Lỗi: {errors} ({time.time()-t0:.1f}s)')

          if q_rows:
              df_q = pd.DataFrame(q_rows)[cols]
              dedup_cols = [c for c in ['Mã chứng khoán', 'Loại báo cáo', 'Loại kỳ', 'Ngày kỳ', 'Chỉ tiêu tiếng Việt'] if c in df.columns]
              if dedup_cols:
                  existing_keys = set(zip(*(df[c].astype(str).str.strip() for c in dedup_cols)))
                  q_keys = list(zip(*(df_q[c].astype(str).str.strip() for c in dedup_cols)))
                  keep_mask = [k not in existing_keys for k in q_keys]
                  df_q = df_q[keep_mask]
              if len(df_q) > 0:
                  df = pd.concat([df, df_q], ignore_index=True)
                  df.to_csv(csv_path, index=False)
                  print(f'✅ Gộp thêm {len(df_q):,} dòng Quý mới trong {time.time()-t0:.1f}s')
          else:
              print(f'ℹ️ Không có dòng Quý mới từ yfinance ({time.time()-t0:.1f}s)')
          PYEOF

      # ==========================================
      # 2c. Làm sạch dữ liệu, ép số chuẩn & tự điền Năm
      # ==========================================
      - name: Clean Data & Format Numbers
        run: |
          set -e
          python << 'PYEOF'
          import os
          import numpy as np
          import pandas as pd

          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          pq_path  = 'data/vietnam_stock_database.parquet'

          if not os.path.exists(csv_path):
              raise FileNotFoundError(f'Không tìm thấy {csv_path}')

          df = pd.read_csv(csv_path, low_memory=False)
          before_rows = len(df)
          df = df.dropna(how='all')

          if 'Giá trị' in df.columns:
              val_num = pd.to_numeric(df['Giá trị'], errors='coerce')
              mask = val_num.notna() & (val_num != 0) & np.isfinite(val_num)
              df = df[mask].copy()
              val_clean = val_num[mask]

              if np.all(np.isclose(val_clean, np.round(val_clean), atol=1e-9)):
                  df['Giá trị'] = np.round(val_clean).astype('int64')
              else:
                  def fmt_num(x):
                      if np.isclose(x, round(x), atol=1e-9):
                          return str(int(round(x)))
                      return f'{x:.6f}'.rstrip('0').rstrip('.')
                  df['Giá trị'] = [fmt_num(v) for v in val_clean]

          if 'Năm' in df.columns and 'Ngày kỳ' in df.columns:
              yr_num = pd.to_numeric(df['Năm'], errors='coerce')
              dt_parsed = pd.to_datetime(df['Ngày kỳ'], errors='coerce')
              missing_yr = yr_num.isna() & dt_parsed.notna()
              if missing_yr.any():
                  df.loc[missing_yr, 'Năm'] = dt_parsed.loc[missing_yr].dt.year.astype('int64')
              yr_final = pd.to_numeric(df['Năm'], errors='coerce')
              df.loc[yr_final.notna(), 'Năm'] = yr_final.loc[yr_final.notna()].astype('int64')

          for col in ['Mã chứng khoán', 'Chỉ tiêu tiếng Việt']:
              if col in df.columns:
                  s = df[col].astype(str).str.strip()
                  df = df[(s != '') & (s.str.upper() != 'NAN') & (s.str.upper() != 'NONE')]

          after_rows = len(df)
          df.to_csv(csv_path, index=False)
          df.to_parquet(pq_path, index=False, engine='pyarrow', compression='snappy')

          csv_mb = os.path.getsize(csv_path) / 1024 / 1024
          pq_mb  = os.path.getsize(pq_path) / 1024 / 1024 if os.path.exists(pq_path) else 0
          print(f'🧹 Làm sạch: {before_rows:,} -> {after_rows:,} dòng | CSV: {csv_mb:.2f} MB | Parquet: {pq_mb:.2f} MB')
          PYEOF

      # ==========================================
      # 3. Verify chất lượng dữ liệu
      # ==========================================
      - name: Verify Data Quality
        run: |
          set -e
          python << 'PYEOF'
          import pandas as pd
          import os, sys, re, math

          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          pq_path  = 'data/vietnam_stock_database.parquet'

          if not os.path.exists(csv_path):
              print('❌ Không tìm thấy file CSV')
              sys.exit(1)

          df = pd.read_csv(csv_path, low_memory=False)
          total = len(df)
          tickers = df['Mã chứng khoán'].nunique() if 'Mã chứng khoán' in df.columns else 0

          with open('main.py', 'r', encoding='utf-8') as f:
              main_source = f.read()
          ticker_match = re.search(r'(?ms)^\s*raw_tickers\s*=\s*\[(.*?)^\s*\]', main_source)
          if not ticker_match:
              print('❌ Không đọc được danh sách raw_tickers từ main.py')
              sys.exit(1)
          expected_tickers = set(re.findall(r"['\"]([A-Z0-9]+)['\"]", ticker_match.group(1)))
          actual_tickers = set(df['Mã chứng khoán'].dropna().astype(str).str.strip().str.upper()) if 'Mã chứng khoán' in df.columns else set()
          covered_tickers = expected_tickers & actual_tickers
          missing_tickers = sorted(expected_tickers - actual_tickers)
          min_coverage_count = math.ceil(len(expected_tickers) * 0.95)
          print(f'📊 Tổng dòng sạch: {total:,} | Số mã: {tickers} | Độ phủ universe: {len(covered_tickers)}/{len(expected_tickers)}')
          if missing_tickers:
              print(f'⚠️ Chưa có dữ liệu cho {len(missing_tickers)} mã: {", ".join(missing_tickers)}')

          required = ['Mã chứng khoán', 'Loại kỳ', 'Năm', 'Chỉ tiêu tiếng Việt', 'Giá trị']
          missing = [c for c in required if c not in df.columns]
          if missing:
              print(f'❌ Thiếu cột bắt buộc: {missing}')
              sys.exit(1)

          val_num = pd.to_numeric(df['Giá trị'], errors='coerce')
          null_count = int(val_num.isna().sum())
          zero_count = int((val_num == 0).sum())
          print(f'🔍 Kiểm tra sạch: null={null_count} | zero={zero_count}')

          if null_count > 0 or zero_count > 0:
              print('❌ Vẫn còn dòng trống hoặc giá trị bằng 0')
              sys.exit(1)
          # Biểu đồ nến chỉ được cập nhật bằng OHLC thật của VN-Index.
          ticker_col = df['Mã chứng khoán'].astype(str).str.strip().str.upper()
          index_df = df[ticker_col.isin(['VN-INDEX', 'VNINDEX'])].copy()
          index_df['metric'] = index_df['Chỉ tiêu tiếng Việt'].astype(str).str.strip().str.lower()
          index_df['trade_date'] = pd.to_datetime(index_df['Ngày kỳ'], errors='coerce')
          index_df['value_num'] = pd.to_numeric(index_df['Giá trị'], errors='coerce')
          ohlc = {'giá mở cửa', 'giá cao nhất', 'giá thấp nhất', 'giá đóng cửa'}
          candle_rows = index_df[index_df['metric'].isin(ohlc)].dropna(subset=['trade_date', 'value_num'])
          candles = candle_rows.pivot_table(index='trade_date', columns='metric', values='value_num', aggfunc='last')
          candles = candles.dropna(subset=list(ohlc), how='any') if set(ohlc).issubset(candles.columns) else pd.DataFrame()
          if len(candles) < 20:
              print(f'❌ VN-Index OHLCV thiếu dữ liệu nến thật: {len(candles)} phiên (cần tối thiểu 20).')
              sys.exit(1)
          latest_date = candles.index.max()
          age_days = (pd.Timestamp.utcnow().tz_localize(None).normalize() - latest_date.normalize()).days
          print(f'🕯️ VN-Index: {len(candles)} phiên OHLC thật; mới nhất {latest_date.date()} ({age_days} ngày).')
          if age_days > 7:
              print(f'❌ Dữ liệu nến VN-Index đã cũ {age_days} ngày; giữ lại dataset trước đó và dừng workflow.')
              sys.exit(1)

          if total < 80000 or len(covered_tickers) < min_coverage_count:
              print(f'❌ Dữ liệu chưa đạt ngưỡng (dòng={total}/80,000, độ phủ={len(covered_tickers)}/{len(expected_tickers)}, yêu cầu tối thiểu {min_coverage_count} mã = 95%)')
              sys.exit(1)
          print(f'✅ Đạt ngưỡng dữ liệu: {total:,} dòng, {len(covered_tickers)}/{len(expected_tickers)} mã (tối thiểu 95%).')

          csv_mb = os.path.getsize(csv_path) / 1024 / 1024
          print(f'📄 CSV: {csv_mb:.1f} MB')
          if csv_mb >= 99.0:
              print('❌ File CSV vượt ngưỡng an toàn 99 MB của GitHub')
              sys.exit(1)

          if os.path.exists(pq_path):
              print(f'💾 Parquet: {os.path.getsize(pq_path)/1024/1024:.1f} MB')

          print('✅ DỮ LIỆU SẠCH & ĐẠT CHUẨN CHẤT LƯỢNG')
          PYEOF

      # ==========================================
      # 4. Commit & Push — ✅ FIX exit 128: guard HEAD~1 + git thuần, chỉ 2 file
      # ==========================================
      - name: Commit & Push Dataset (an toàn, không HEAD~1 mù)
        run: |
          set -e
          python << 'PYEOF'
          from pathlib import Path

          data_dir = Path('data')
          keep = {
              'data/vietnam_stock_database_tong_hop.csv',
              'data/vietnam_stock_database.parquet',
          }
          for name in sorted(keep):
              if not Path(name).is_file():
                  raise FileNotFoundError(f'Thiếu file dữ liệu bắt buộc: {name}')

          removed = 0
          for path in data_dir.rglob('*'):
              if path.is_file() and path.as_posix() not in keep:
                  path.unlink()
                  removed += 1
          for path in sorted((p for p in data_dir.rglob('*') if p.is_dir()),
                             key=lambda p: len(p.parts), reverse=True):
              if not any(path.iterdir()):
                  path.rmdir()

          remaining = {p.as_posix() for p in data_dir.rglob('*') if p.is_file()}
          if remaining != keep:
              raise RuntimeError(f'Data folder không đúng 2 file chính: {sorted(remaining)}')
          print(f'🧹 Đã xóa {removed} file phụ; data/ chỉ còn CSV + Parquet chính.')
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Chỉ undo commit auto cũ NẾU nó tồn tại VÀ HEAD~1 hợp lệ (fetch-depth=0 nên luôn ok)
          if git log -1 --pretty=%s 2>/dev/null | grep -q "Auto-update FINEX Dataset"; then
            if git rev-parse --verify -q HEAD~1 >/dev/null 2>&1; then
              git reset --soft HEAD~1 || true
              git reset HEAD >/dev/null 2>&1 || true
              echo "♻️ Đã undo commit auto cũ để gộp dữ liệu mới."
            fi
          fi

          git add -A -- data/
          python << 'PYEOF'
          import subprocess

          expected = {
              'data/vietnam_stock_database_tong_hop.csv',
              'data/vietnam_stock_database.parquet',
          }
          staged = set(subprocess.check_output(
              ['git', 'ls-files', '--cached', '--others', '--exclude-standard', '--', 'data/'],
              text=True,
          ).splitlines())
          if staged != expected:
              raise RuntimeError(f'Git index trong data/ không đúng 2 file chính: {sorted(staged)}')
          print('✅ Git index data/ đã xác nhận đúng 2 file chính.')
          PYEOF
          if git diff --cached --quiet; then
            echo "✅ Không có thay đổi dữ liệu — bỏ qua commit."
            exit 0
          fi
          git commit -m "Auto-update FINEX Dataset $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]" --no-verify
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin HEAD:"${GITHUB_REF_NAME}"
          echo "✅ Đã push đúng 2 file data chính; các file phụ trong data/ đã được xóa khỏi repository."

      # ==========================================
      # 5. Upload HuggingFace (retry 3 lần)
      # ==========================================
      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          python << 'PYEOF'
          from huggingface_hub import HfApi
          from tenacity import retry, stop_after_attempt, wait_exponential
          import os

          file_path = 'data/vietnam_stock_database.parquet'
          if not os.path.exists(file_path):
              raise FileNotFoundError(file_path)

          api = HfApi(token=os.environ['HF_TOKEN'])

          @retry(stop=stop_after_attempt(3), wait=wait_exponential(multiplier=1, min=2, max=30))
          def upload():
              print('⬆️ Uploading to HuggingFace Space...')
              api.upload_file(
                  path_or_fileobj=file_path,
                  path_in_repo='du_lieu/dulieu_hang_ngay.parquet',
                  repo_id='trananhquan2001/trananhquan-terminal',
                  repo_type='space',
              )

          upload()
          print('✅ HuggingFace upload thành công')
          PYEOF

      # ==========================================
      # 6. Đồng bộ Supabase — ✅ batch 200 + retry + đổi client (hết ConnectionTerminated)
      # ==========================================
      - name: Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          python << 'PYEOF'
          import os, time, random
          import pandas as pd
          from datetime import datetime

          print('--- SUPABASE SYNC (batch 200 + retry + đổi client) ---')
          from supabase import create_client
          try:
              from supabase import ClientOptions
              sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'],
                                 options=ClientOptions(postgrest_client_timeout=90))
          except Exception:
              sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])

          df = pd.read_csv('data/vietnam_stock_database_tong_hop.csv', low_memory=False)
          col_map = {
              'Mã chứng khoán': 'ticker', 'Tên doanh nghiệp': 'company_name', 'Tên ngành': 'sector',
              'Loại báo cáo': 'report_type', 'Loại kỳ': 'period_type', 'Năm': 'year',
              'Ngày kỳ': 'report_date', 'Chỉ tiêu tiếng Việt': 'item_vn', 'Giá trị': 'value'
          }
          df = df.rename(columns={k: v for k, v in col_map.items() if k in df.columns})
          df = df.dropna(subset=['ticker', 'value'])
          df['ticker'] = df['ticker'].astype(str).str.strip().str.upper()
          df = df[df['ticker'] != 'NAN']
          df['value'] = pd.to_numeric(df['value'], errors='coerce')
          df = df.dropna(subset=['value'])
          df = df[df['value'] != 0]
          df['year'] = pd.to_numeric(df.get('year'), errors='coerce').fillna(datetime.now().year).astype(int)
          for col in ['company_name', 'sector', 'report_type', 'period_type', 'report_date', 'item_vn']:
              if col in df.columns:
                  df[col] = df[col].astype(str).replace(['nan', 'NaN', 'None', ''], None)

          records = df.to_dict('records')
          total = len(records)
          print(f'📦 Chuẩn bị upsert {total:,} bản ghi...')

          NET_KEYS = ('connectionterminated', 'connection', 'timeout', 'timed out', 'goaway',
                      'go away', 'server disconnected', 'protocolerror', 'eof', 'closed')
          def is_net(e):
              if type(e).__name__ in ('ConnectionTerminated','ConnectionError','ConnectError','ReadTimeout',
                                      'ConnectTimeout','PoolTimeout','RemoteProtocolError','ProtocolError'):
                  return True
              s = str(e).lower()
              return any(k in s for k in NET_KEYS)

          def new_client():
              global sb
              try:
                  from supabase import ClientOptions
                  sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'],
                                     options=ClientOptions(postgrest_client_timeout=90))
              except Exception:
                  sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])
              print('  🔄 Tạo lại client Supabase (pool HTTP/2 mới)')

          BATCH, MAX_ATTEMPT = 200, 3
          failed = 0
          ok_batches = 0
          for i in range(0, total, BATCH):
              batch = records[i:i+BATCH]
              attempt = 0
              while True:
                  try:
                      sb.table('finex_stock_master').upsert(
                          batch, on_conflict='ticker,report_type,period_type,report_date,item_vn'
                      ).execute()
                      ok_batches += 1
                      if ok_batches % 10 == 0 or i + BATCH >= total:
                          print(f'  ✅ {min(i+BATCH, total):,}/{total:,}')
                      if ok_batches % 40 == 0:
                          new_client()
                      time.sleep(0.25)
                      break
                  except Exception as e:
                      attempt += 1
                      if is_net(e):
                          new_client()
                      if attempt >= MAX_ATTEMPT:
                          print(f'  ❌ Batch {i} lỗi vĩnh viễn: {type(e).__name__} (bỏ qua, lần sau đẩy lại)')
                          failed += len(batch)
                          break
                      wait = min(2 ** attempt, 15) + random.uniform(0, 1)
                      print(f'  ⚠️ Batch {i} lỗi lần {attempt}/{MAX_ATTEMPT}, retry sau {wait:.1f}s')
                      time.sleep(wait)

          print(f'🎉 Supabase sync hoàn tất! Đẩy được {total-failed:,}/{total:,} (lỗi giữ lại: {failed:,})')
          PYEOF

      # ==========================================
      # 7. Báo cáo cuối
      # ==========================================
      - name: Final Report
        if: always()
        run: |
          echo "=============================================="
          echo "  FINEX Pipeline v21.5 (122 mã, kiểm tra độ phủ 95%)"
          echo "=============================================="
          ls -lh data/*.parquet data/*.csv 2>/dev/null || echo "⚠️ Không có file data"
