name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas requests yfinance openpyxl huggingface_hub
          # Cài đặt vnstock phiên bản mới nhất từ kho riêng của họ (v5)
          pip install --no-cache-dir --extra-index-url https://vnstocks.com/api/packages vnstock

      - name: Run FINEX Enterprise Engine
        env:
          # Truyền API Key đã giấu trong GitHub Secrets vào biến môi trường
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python main.py

      - name: Commit and push changes to GitHub (Backup)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          git add data/vietnam_stock_database_tong_hop.csv || true
          git diff --staged --quiet || git commit -m "Auto-update FINEX Master Dataset [skip ci]"
          git push origin main

      - name: Push Dataset Directly to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          api.upload_file(
              path_or_fileobj='data/vietnam_stock_database_tong_hop.csv',
              path_in_repo='data/vietnam_stock_database_tong_hop.csv',
              repo_id='trananhquan2001/trananhquan-terminal',
              repo_type='space',
              token='${{ secrets.HF_TOKEN }}'
          )
          print('Đã đẩy thành công lên Hugging Face Space!')
          "
