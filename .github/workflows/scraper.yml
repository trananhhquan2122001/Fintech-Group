name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas requests yfinance openpyxl huggingface_hub
          pip install --no-cache-dir --extra-index-url https://vnstocks.com/api/packages vnstock
          pip install --no-cache-dir vnfinancialdata

      - name: Run FINEX Enterprise Engine
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          python main.py

      # ==========================================
      # 1. LƯU FILE CSV LÊN GITHUB (GIỮ NGUYÊN)
      # ==========================================
      - name: Commit and push changes to GitHub (Backup CSV)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          git add data/vietnam_stock_database_tong_hop.csv || true
          git diff --staged --quiet || git commit -m "Auto-update FINEX Master Dataset [skip ci]"
          git push origin main

      # ==========================================
      # 2. LƯU FILE LÊN HUGGING FACE DATASET (ĐÃ ĐỔI TÊN)
      # ==========================================
      - name: Push Dataset to Hugging Face Dataset Repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi, create_repo
          import os
          
          api = HfApi()
          dataset_repo_id = 'trananhquan2001/finex-vn-dataset'
          local_file_path = 'data/vietnam_stock_database_tong_hop.csv'
          
          # Tên file mới hiển thị trên Hugging Face Dataset
          remote_file_name = 'dulieu_hang_ngay.csv'
          
          print(f'Đang kiểm tra/tạo Dataset Repository: {dataset_repo_id}...')
          try:
              create_repo(repo_id=dataset_repo_id, repo_type='dataset', token=os.environ['HF_TOKEN'], exist_ok=True)
              print('Dataset Repo đã sẵn sàng.')
          except Exception as e:
              print(f'Lỗi tạo dataset repo: {e}')
              raise
              
          print(f'Đang upload file lên Hugging Face với tên: {remote_file_name}...')
          api.upload_file(
              path_or_fileobj=local_file_path,
              path_in_repo=remote_file_name,
              repo_id=dataset_repo_id,
              repo_type='dataset',
              token=os.environ['HF_TOKEN']
          )
          print('Đã đẩy thành công lên Hugging Face Dataset!')
          "
