# ============================================================================
# Financial Data Scraper Pipeline — v22.0
# ============================================================================
# ✅ FIX 1 (lỗi bạn gặp): ngưỡng Verify "tickers < 160" -> theo universe 132 mã
#           (MIN_TICKERS=120, MIN_ROWS=80000 chỉnh được qua env) + in danh sách mã thiếu
# ✅ FIX 2: BỎ bước "Quét Quý đa luồng" cũ (2b). Bước đó:
#           - nạp nhãn TIẾNG ANH thô (Total Assets...) phá cổng dịch của main.py
#           - gán Loại kỳ "Quý 1" / Ngày kỳ "YYYY-MM-DD" sai chuẩn "Quý" / "YYYY-Qn"
#           - quét cả mã ngoài 132 (glob mọi csv có chữ "stock")
#           main.py v23.1 đã tự bù Quý (YF_QUARTER) nên bước này thừa và có hại
# ✅ FIX 3: Engine timeout 1200s -> 2400s (có -k 60) + kiểm tra CSV thật sự được
#           tạo mới trong lần chạy này (chặn dùng nhầm file cũ trong repo)
# ✅ FIX 4: Commit: bỏ reset --soft HEAD~1 vô nghĩa; push có retry + rebase -X theirs
# ✅ FIX 5: Supabase: bỏ replace(..., None) (pandas bị pad/ffill sai nhãn),
#           khử trùng khóa on_conflict trước upsert (tránh lỗi "affect row a second time"),
#           bỏ dòng thiếu khóa; HF + Supabase không làm đỏ job nữa (dữ liệu đã commit)
# ✅ Giữ nguyên: cloudscraper==1.2.71, pandas<3, fetch-depth 0, chỉ commit 2 file
# ============================================================================
name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'   # 00:00 giờ Việt Nam (UTC+7)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MIN_ROWS: "80000"
      MIN_TICKERS: "120"        # universe 132 mã; cho phép thiếu tối đa ~12 mã Yahoo không có dữ liệu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          set -e
          python -m pip install --upgrade pip wheel setuptools
          pip install --no-cache-dir \
            "yfinance>=0.2.54" \
            "pandas>=2.2.3,<3" \
            "numpy>=1.26,<2.3" \
            "pyarrow>=16" \
            "httpx[http2]>=0.27" \
            "tenacity>=8.3" \
            "huggingface_hub>=0.30" \
            "supabase>=2.17" \
            "vnfinancialdata>=0.1.2" \
            "openpyxl>=3.1" \
            "tqdm>=4.66" \
            "requests>=2.32" \
            "lxml>=5.0" \
            "beautifulsoup4>=4.12" \
            "cloudscraper==1.2.71"
          echo "📦 Đã cài:"
          pip list | grep -Ei "^(yfinance|pandas|numpy|pyarrow|httpx|supabase|cloudscraper|huggingface-hub|tenacity) " || true

      # ==========================================
      # 1. Diagnostic nhanh các nguồn (không làm fail job)
      # ==========================================
      - name: Diagnostic Sources
        continue-on-error: true
        run: |
          python -c "
          import yfinance as yf
          from concurrent.futures import ThreadPoolExecutor

          def check_sym(sym):
              try:
                  t = yf.Ticker(sym)
                  q_is = t.quarterly_income_stmt
                  c_is = 0 if q_is is None or getattr(q_is, 'empty', True) else q_is.size
                  return f'✅ {sym}: Q_IS={c_is}'
              except Exception as e:
                  return f'⚠️ {sym}: {type(e).__name__}: {str(e)[:80]}'

          with ThreadPoolExecutor(max_workers=3) as ex:
              for line in ex.map(check_sym, ['FPT.VN', 'ACB.VN', 'VNM.VN']):
                  print(line)
          "

      # ==========================================
      # 2. Chạy FINEX Engine (main.py đã tự bù Quý bằng yfinance đa luồng)
      # ==========================================
      - name: Run FINEX Engine
        env:
          SKIP_VNDIRECT: "true"
          SKIP_VNDIRECT_BCTC: "true"
          DISABLE_VNDIRECT: "true"
          RUN_VNDIRECT_BCTC: "false"
          PUSH_TO_SUPABASE: "false"
          USE_YFINANCE: "true"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          date +%s > /tmp/finex_start
          echo "🚀 Starting FINEX Engine (skip VNDirect BCTC)..."
          code=0
          timeout -k 60 2400 python main.py || code=$?
          if [ "$code" -ne 0 ]; then
            echo "⚠️ Engine dừng với mã thoát: $code (124 = hết thời gian)"
          fi

          # Chặn dùng nhầm file cũ trong repo: CSV phải được ghi MỚI trong lần chạy này
          CSV=data/vietnam_stock_database_tong_hop.csv
          if [ ! -f "$CSV" ]; then
            echo "❌ Engine không tạo ra $CSV"
            exit 1
          fi
          START=$(cat /tmp/finex_start)
          MTIME=$(stat -c %Y "$CSV")
          if [ "$MTIME" -lt "$START" ]; then
            echo "❌ $CSV là file CŨ (không được ghi mới trong lần chạy này) — dừng để tránh commit dữ liệu cũ."
            exit 1
          fi
          echo "✅ FINEX Engine finished."

      # ==========================================
      # 3. Làm sạch dữ liệu, ép số chuẩn & tự điền Năm
      # ==========================================
      - name: Clean Data & Format Numbers
        run: |
          set -e
          python << 'PYEOF'
          import os
          import numpy as np
          import pandas as pd

          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          pq_path  = 'data/vietnam_stock_database.parquet'

          if not os.path.exists(csv_path):
              raise FileNotFoundError(f'Không tìm thấy {csv_path}')

          df = pd.read_csv(csv_path, low_memory=False)
          before_rows = len(df)
          df = df.dropna(how='all')

          if 'Giá trị' in df.columns:
              val_num = pd.to_numeric(df['Giá trị'], errors='coerce')
              mask = val_num.notna() & (val_num != 0) & np.isfinite(val_num)
              df = df[mask].copy()
              val_clean = val_num[mask]

              if np.all(np.isclose(val_clean, np.round(val_clean), atol=1e-9)):
                  df['Giá trị'] = np.round(val_clean).astype('int64')
              else:
                  def fmt_num(x):
                      if np.isclose(x, round(x), atol=1e-9):
                          return str(int(round(x)))
                      return f'{x:.6f}'.rstrip('0').rstrip('.')
                  df['Giá trị'] = [fmt_num(v) for v in val_clean]

          if 'Năm' in df.columns and 'Ngày kỳ' in df.columns:
              yr_num = pd.to_numeric(df['Năm'], errors='coerce')
              dt_parsed = pd.to_datetime(df['Ngày kỳ'], errors='coerce')
              missing_yr = yr_num.isna() & dt_parsed.notna()
              if missing_yr.any():
                  df.loc[missing_yr, 'Năm'] = dt_parsed.loc[missing_yr].dt.year.astype('int64')
              yr_final = pd.to_numeric(df['Năm'], errors='coerce')
              df.loc[yr_final.notna(), 'Năm'] = yr_final.loc[yr_final.notna()].astype('int64')

          for col in ['Mã chứng khoán', 'Chỉ tiêu tiếng Việt']:
              if col in df.columns:
                  s = df[col].astype(str).str.strip()
                  df = df[(s != '') & (s.str.upper() != 'NAN') & (s.str.upper() != 'NONE')]

          after_rows = len(df)
          df.to_csv(csv_path, index=False)
          df.to_parquet(pq_path, index=False, engine='pyarrow', compression='snappy')

          csv_mb = os.path.getsize(csv_path) / 1024 / 1024
          pq_mb  = os.path.getsize(pq_path) / 1024 / 1024 if os.path.exists(pq_path) else 0
          print(f'🧹 Làm sạch: {before_rows:,} -> {after_rows:,} dòng | CSV: {csv_mb:.2f} MB | Parquet: {pq_mb:.2f} MB')
          PYEOF

      # ==========================================
      # 4. Verify chất lượng dữ liệu (ngưỡng theo universe 132 mã)
      # ==========================================
      - name: Verify Data Quality
        run: |
          set -e
          python << 'PYEOF'
          import os, sys
          import pandas as pd

          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          pq_path  = 'data/vietnam_stock_database.parquet'
          MIN_ROWS = int(os.environ.get('MIN_ROWS', '80000'))
          MIN_TICKERS = int(os.environ.get('MIN_TICKERS', '120'))

          if not os.path.exists(csv_path):
              print('❌ Không tìm thấy file CSV')
              sys.exit(1)

          df = pd.read_csv(csv_path, low_memory=False)
          total = len(df)
          tickers = df['Mã chứng khoán'].nunique() if 'Mã chứng khoán' in df.columns else 0
          print(f'📊 Tổng dòng sạch: {total:,} | Số mã: {tickers}')

          required = ['Mã chứng khoán', 'Loại kỳ', 'Năm', 'Chỉ tiêu tiếng Việt', 'Giá trị']
          missing = [c for c in required if c not in df.columns]
          if missing:
              print(f'❌ Thiếu cột bắt buộc: {missing}')
              sys.exit(1)

          # In danh sách mã thiếu so với universe (chỉ để thông tin, không làm fail)
          try:
              from main import load_132_master_tickers
              universe = set(load_132_master_tickers().keys())
              have = set(df['Mã chứng khoán'].astype(str).str.strip().str.upper().unique())
              miss = sorted(universe - have)
              extra = sorted(have - universe)
              print(f'🧭 Universe {len(universe)} mã | thiếu {len(miss)}: {", ".join(miss) if miss else "-"}')
              if extra:
                  print(f'ℹ️ Mã ngoài universe (chỉ số/dữ liệu cũ): {", ".join(extra[:20])}')
          except Exception as e:
              print(f'ℹ️ Bỏ qua đối chiếu universe: {type(e).__name__}')

          val_num = pd.to_numeric(df['Giá trị'], errors='coerce')
          null_count = int(val_num.isna().sum())
          zero_count = int((val_num == 0).sum())
          print(f'🔍 Kiểm tra sạch: null={null_count} | zero={zero_count}')

          if null_count > 0 or zero_count > 0:
              print('❌ Vẫn còn dòng trống hoặc giá trị bằng 0')
              sys.exit(1)

          if total < MIN_ROWS or tickers < MIN_TICKERS:
              print(f'❌ Dữ liệu quá ít (dòng={total} < {MIN_ROWS} hoặc mã={tickers} < {MIN_TICKERS})')
              sys.exit(1)

          csv_mb = os.path.getsize(csv_path) / 1024 / 1024
          print(f'📄 CSV: {csv_mb:.1f} MB')
          if csv_mb >= 99.0:
              print('❌ File CSV vượt ngưỡng an toàn 99 MB của GitHub')
              sys.exit(1)

          if os.path.exists(pq_path):
              print(f'💾 Parquet: {os.path.getsize(pq_path)/1024/1024:.1f} MB')

          print('✅ DỮ LIỆU SẠCH & ĐẠT CHUẨN CHẤT LƯỢNG')
          PYEOF

      # ==========================================
      # 5. Commit & Push — git thuần, chỉ 2 file, push có retry
      # ==========================================
      - name: Commit & Push Dataset
        run: |
          set -e
          rm -f data/_checkpoint.csv data/bao_cao_*.csv data/_emergency_backup.csv data/_emergency_backup.parquet 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/vietnam_stock_database_tong_hop.csv data/vietnam_stock_database.parquet
          if git diff --cached --quiet; then
            echo "✅ Không có thay đổi dữ liệu — bỏ qua commit."
            exit 0
          fi
          git commit -m "Auto-update FINEX Dataset $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]" --no-verify

          pushed=0
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}"; then
              pushed=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "⚠️ Push lần $i lỗi, thử lại..."
            sleep $((i * 5))
          done
          if [ "$pushed" != "1" ]; then
            echo "❌ Push thất bại sau 3 lần"
            exit 1
          fi
          echo "✅ Đã push đúng 2 đường dẫn: CSV + Parquet."

      # ==========================================
      # 6. Upload HuggingFace (retry 3 lần; không làm đỏ job)
      # ==========================================
      - name: Push to HuggingFace
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          python << 'PYEOF'
          from huggingface_hub import HfApi
          from tenacity import retry, stop_after_attempt, wait_exponential
          import os

          file_path = 'data/vietnam_stock_database.parquet'
          if not os.path.exists(file_path):
              raise FileNotFoundError(file_path)

          api = HfApi(token=os.environ['HF_TOKEN'])

          @retry(stop=stop_after_attempt(3), wait=wait_exponential(multiplier=1, min=2, max=30))
          def upload():
              print('⬆️ Uploading to HuggingFace Space...')
              api.upload_file(
                  path_or_fileobj=file_path,
                  path_in_repo='du_lieu/dulieu_hang_ngay.parquet',
                  repo_id='trananhquan2001/trananhquan-terminal',
                  repo_type='space',
              )

          upload()
          print('✅ HuggingFace upload thành công')
          PYEOF

      # ==========================================
      # 7. Đồng bộ Supabase — batch 200, retry, đổi client, khử trùng khóa
      # ==========================================
      - name: Sync to Supabase
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          python << 'PYEOF'
          import os, time, random
          import pandas as pd
          from datetime import datetime
          from supabase import create_client

          print('--- SUPABASE SYNC (batch 200 + retry + đổi client) ---')

          def make_client():
              try:
                  from supabase import ClientOptions
                  return create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'],
                                       options=ClientOptions(postgrest_client_timeout=90))
              except Exception:
                  return create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])

          sb = make_client()

          df = pd.read_csv('data/vietnam_stock_database_tong_hop.csv', low_memory=False)
          col_map = {
              'Mã chứng khoán': 'ticker', 'Tên doanh nghiệp': 'company_name', 'Tên ngành': 'sector',
              'Loại báo cáo': 'report_type', 'Loại kỳ': 'period_type', 'Năm': 'year',
              'Ngày kỳ': 'report_date', 'Chỉ tiêu tiếng Việt': 'item_vn', 'Giá trị': 'value'
          }
          df = df.rename(columns={k: v for k, v in col_map.items() if k in df.columns})

          # Chuẩn hoá chuỗi: rỗng / nan / None -> None (không dùng replace(...None) vì pandas sẽ ffill sai)
          str_cols = ['ticker', 'company_name', 'sector', 'report_type', 'period_type', 'report_date', 'item_vn']
          for col in str_cols:
              if col in df.columns:
                  df[col] = df[col].map(
                      lambda x: None if x is None or (isinstance(x, float) and pd.isna(x))
                      or str(x).strip() in ('', 'nan', 'NaN', 'None') else str(x).strip()
                  )

          df['value'] = pd.to_numeric(df['value'], errors='coerce')
          df['ticker'] = df['ticker'].map(lambda x: x.upper() if x else x)
          key_cols = ['ticker', 'report_type', 'period_type', 'report_date', 'item_vn']
          df = df.dropna(subset=key_cols + ['value'])
          df = df[df['value'] != 0]
          df['year'] = pd.to_numeric(df.get('year'), errors='coerce').fillna(datetime.now().year).astype(int)

          # Khử trùng khóa on_conflict: tránh "ON CONFLICT DO UPDATE command cannot affect row a second time"
          before = len(df)
          df = df.drop_duplicates(subset=key_cols, keep='last')
          if before - len(df):
              print(f'🧹 Loại {before - len(df):,} dòng trùng khóa trước khi upsert')

          df = df[[c for c in ['ticker', 'company_name', 'sector', 'report_type', 'period_type',
                               'year', 'report_date', 'item_vn', 'value'] if c in df.columns]]
          df['value'] = df['value'].astype(float)
          records = df.astype(object).where(df.notna(), None).to_dict('records')
          total = len(records)
          print(f'📦 Chuẩn bị upsert {total:,} bản ghi...')

          NET_KEYS = ('connectionterminated', 'connection', 'timeout', 'timed out', 'goaway',
                      'go away', 'server disconnected', 'protocolerror', 'eof', 'closed')
          def is_net(e):
              if type(e).__name__ in ('ConnectionTerminated', 'ConnectionError', 'ConnectError', 'ReadTimeout',
                                      'ConnectTimeout', 'PoolTimeout', 'RemoteProtocolError', 'ProtocolError'):
                  return True
              s = str(e).lower()
              return any(k in s for k in NET_KEYS)

          BATCH, MAX_ATTEMPT = 200, 4
          failed = 0
          ok_batches = 0
          for i in range(0, total, BATCH):
              batch = records[i:i + BATCH]
              attempt = 0
              while True:
                  try:
                      sb.table('finex_stock_master').upsert(
                          batch, on_conflict='ticker,report_type,period_type,report_date,item_vn'
                      ).execute()
                      ok_batches += 1
                      if ok_batches % 10 == 0 or i + BATCH >= total:
                          print(f'  ✅ {min(i + BATCH, total):,}/{total:,}')
                      if ok_batches % 40 == 0:
                          sb = make_client()
                          print('  🔄 Tạo lại client Supabase')
                      time.sleep(0.25)
                      break
                  except Exception as e:
                      attempt += 1
                      if is_net(e):
                          sb = make_client()
                          print('  🔄 Tạo lại client Supabase (lỗi mạng)')
                      if attempt >= MAX_ATTEMPT:
                          print(f'  ❌ Batch {i} lỗi vĩnh viễn: {type(e).__name__}: {str(e)[:120]} (bỏ qua, lần sau đẩy lại)')
                          failed += len(batch)
                          break
                      wait = min(2 ** attempt, 15) + random.uniform(0, 1)
                      print(f'  ⚠️ Batch {i} lỗi lần {attempt}/{MAX_ATTEMPT}, retry sau {wait:.1f}s')
                      time.sleep(wait)

          print(f'🎉 Supabase sync hoàn tất! Đẩy được {total - failed:,}/{total:,} (lỗi giữ lại: {failed:,})')
          PYEOF

      # ==========================================
      # 8. Báo cáo cuối
      # ==========================================
      - name: Final Report
        if: always()
        run: |
          echo "=============================================="
          echo "  FINEX Pipeline v22.0"
          echo "=============================================="
          ls -lh data/*.parquet data/*.csv 2>/dev/null || echo "⚠️ Không có file data"
