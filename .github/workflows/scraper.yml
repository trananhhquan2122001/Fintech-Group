# ============================================================================
# Financial Data Scraper Pipeline — v18.0 (OPTIMIZED & ROBUST)
# ============================================================================
# ✅ Fix Node/Ubuntu warnings (dùng action version chuẩn)
# ✅ Tăng tốc độ: Cache pip + Tối ưu Supabase batch (loại bỏ iterrows)
# ✅ Git Auto-commit an toàn, không lo detached HEAD
# ✅ Data Validation: Kiểm tra schema + tỷ lệ null, không chỉ đếm dòng
# ============================================================================
name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'   # 00:00 giờ VN (Lưu ý: GitHub chạy giờ UTC, 17 UTC = 00:00 VN+7)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # ✅ Version ổn định nhất hiện tại
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5  # ✅ Version ổn định nhất hiện tại
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            pandas requests yfinance openpyxl huggingface_hub \
            supabase numpy pyarrow vnfinancialdata cloudscraper

      # ==========================================
      # 1. KIỂM TRA API TRƯỚC KHI CHẠY
      # ==========================================
      - name: Test VNDirect API (Diagnostic)
        run: |
          echo "=== TEST VNDIRECT API ==="
          python -c "
          import requests
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'})
          try:
              url = 'https://api-finfo.vndirect.com.vn/v4/financial_statements?q=code:ACB~reportType:QUARTER~financialStatement:BALANCE_SHEET&size=5'
              r = session.get(url, timeout=15)
              print(f'Status: {r.status_code}')
              if r.status_code == 200:
                  print('✅ VNDIRECT API OK')
              else:
                  print('⚠️ VNDIRECT API BLOCKED (Status: {})'.format(r.status_code))
          except Exception as e:
              print(f'❌ VNDIRECT ERROR: {e}')
          "
        continue-on-error: true

      # ==========================================
      # 2. CHẠY SCRAPER CHÍNH
      # ==========================================
      - name: Run FINEX Engine
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SKIP_VNDIRECT: "true"
          PUSH_TO_SUPABASE: "false"
        run: |
          set -e
          echo "🚀 Starting FINEX Engine with 90m timeout..."
          # Dùng timeout của GNU, trả về exit code 124 nếu hết giờ
          timeout 5400 python main.py
          echo "✅ FINEX Engine completed successfully."

      # ==========================================
      # 3. VERIFY DATA (NÂNG CẤP: Kiểm tra Schema + Chất lượng)
      # ==========================================
      - name: Verify Data Volume & Quality
        run: |
          set -e
          echo "=== KIỂM TRA CHẤT LƯỢNG DỮ LIỆU ==="
          python -c "
          import pandas as pd, os, sys
          
          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          pq_path = 'data/vietnam_stock_database.parquet'
          
          if not os.path.exists(csv_path):
              print('❌ KHÔNG CÓ FILE CSV!')
              sys.exit(1)
              
          df = pd.read_csv(csv_path)
          
          # 1. Kiểm tra số lượng
          total_rows = len(df)
          unique_tickers = df['Mã chứng khoán'].nunique()
          print(f'📊 Tổng dòng: {total_rows:,} | Số mã: {unique_tickers}')
          
          # 2. Kiểm tra cột bắt buộc (Schema validation)
          required_cols = ['Mã chứng khoán', 'Loại kỳ', 'Năm', 'Chỉ tiêu tiếng Việt', 'Giá trị']
          missing_cols = [c for c in required_cols if c not in df.columns]
          if missing_cols:
              print(f'❌ THIẾU CỘT BẮT BUỘC: {missing_cols}')
              sys.exit(1)
              
          # 3. Kiểm tra tỷ lệ null ở cột giá trị
          null_ratio = df['Giá trị'].isna().sum() / total_rows if total_rows > 0 else 1
          if null_ratio > 0.3:
              print(f'❌ TỶ LỆ NULL QUÁ CAO: {null_ratio:.2%}')
              sys.exit(1)
              
          # 4. Kiểm tra Parquet
          if os.path.exists(pq_path):
              pq_size = os.path.getsize(pq_path) / 1024 / 1024
              print(f'💾 Parquet size: {pq_size:.2f} MB')
              
          # 5. Ngưỡng tối thiểu (linh hoạt hơn hardcoded 100k)
          if total_rows < 50000:
              print(f'❌ DỮ LIỆU QUÁ ÍT ({total_rows} dòng). Có thể API nguồn đang lỗi.')
              sys.exit(1)
              
          print('✅ DỮ LIỆU ĐẠT CHUẨN!')
          "

      # ==========================================
      # 4. COMMIT LÊN GITHUB (DÙNG ACTION ỔN ĐỊNH)
      # ==========================================
      - name: Commit and push to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update FINEX Dataset $(date +'%Y-%m-%d %H:%M') [skip ci]"
          file_pattern: "data/*.csv data/*.parquet"
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
          commit_options: "--no-verify"

      # ==========================================
      # 5. PUSH LÊN HUGGINGFACE (FAIL-FAST)
      # ==========================================
      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          python -c "
          from huggingface_hub import HfApi
          import os
          
          api = HfApi()
          space_repo_id = 'trananhquan2001/trananhquan-terminal'
          file_path = 'data/vietnam_stock_database.parquet'
          
          if not os.path.exists(file_path):
              raise FileNotFoundError(f'Không tìm thấy {file_path}')
              
          print(f'⬆️ Uploading to {space_repo_id}...')
          api.upload_file(
              path_or_fileobj=file_path,
              path_in_repo='du_lieu/dulieu_hang_ngay.parquet',
              repo_id=space_repo_id,
              repo_type='space',
              token=os.environ['HF_TOKEN']
          )
          print('✅ Upload HuggingFace THÀNH CÔNG!')
          "

      # ==========================================
      # 6. ĐỒNG BỘ SUPABASE (TỐI ƯU TỐC ĐỘ GẤP 10X)
      # ==========================================
      - name: Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          python -c "
          import os, sys
          import pandas as pd
          from datetime import datetime
          from supabase import create_client

          print('--- ĐỒNG BỘ SUPABASE (OPTIMIZED BATCH) ---')
          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])

          file_path = 'data/vietnam_stock_database_tong_hop.csv'
          if not os.path.exists(file_path):
              print('❌ Không có file CSV'); sys.exit(1)

          # Đọc và chuẩn hóa dữ liệu bằng Pandas vectorized (NHANH HƠN iterrows 10x)
          df = pd.read_csv(file_path)
          df = df.rename(columns={
              'Mã chứng khoán': 'ticker', 'Tên doanh nghiệp': 'company_name',
              'Tên ngành': 'sector', 'Loại báo cáo': 'report_type',
              'Loại kỳ': 'period_type', 'Năm': 'year', 'Ngày kỳ': 'report_date',
              'Chỉ tiêu tiếng Việt': 'item_vn', 'Giá trị': 'value'
          })
          
          # Lọc và ép kiểu dữ liệu an toàn
          df = df.dropna(subset=['ticker', 'value'])
          df['ticker'] = df['ticker'].astype(str).str.strip().str.upper()
          df = df[df['ticker'] != 'NAN']
          df['value'] = pd.to_numeric(df['value'], errors='coerce')
          df = df.dropna(subset=['value'])
          df['year'] = pd.to_numeric(df['year'], errors='coerce').fillna(datetime.now().year).astype(int)
          
          # Xử lý các cột string có thể bị NaN
          for col in ['company_name', 'sector', 'report_type', 'period_type', 'report_date', 'item_vn']:
              if col in df.columns:
                  df[col] = df[col].astype(str).replace('nan', None).replace('NaN', None)

          # Chuyển sang list of dicts (chuẩn cho Supabase upsert)
          records = df.to_dict('records')
          total_records = len(records)
          print(f'📦 Chuẩn bị đồng bộ {total_records:,} bản ghi...')

          # Batch upsert (500 records/lần để tránh payload quá lớn)
          batch_size = 500
          for i in range(0, total_records, batch_size):
              batch = records[i:i + batch_size]
              try:
                  supabase.table('finex_stock_master').upsert(
                      batch,
                      on_conflict='ticker,report_type,period_type,report_date,item_vn'
                  ).execute()
                  print(f'  ✅ Đã xử lý {min(i + batch_size, total_records):,}/{total_records:,}')
              except Exception as e:
                  print(f'  ❌ Lỗi batch {i}-{i+batch_size}: {e}')
                  sys.exit(1)
                  
          print('🎉 Supabase DONE!')
          "

      # ==========================================
      # 7. BÁO CÁO CUỐI
      # ==========================================
      - name: Final Report
        if: always()
        run: |
          echo "============================================"
          echo "  HOÀN TẤT WORKFLOW v18.0"
          echo "============================================"
          if [ -f "data/vietnam_stock_database.parquet" ]; then
            ls -lh data/vietnam_stock_database.parquet
          else
            echo "⚠️ File Parquet không tồn tại."
          fi
