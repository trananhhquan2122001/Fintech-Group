name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 6'

jobs:
  run-scraper:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Force Clean and Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir --force-reinstall pandas requests yfinance openpyxl

      - name: Run main script
        run: |
          python main.py

      - name: Verify Excel and CSV files generated
        run: |
          ls -la
          ls -la data/ || true
          if [ ! -f "vietnam_stock_database.xlsx" ]; then
            echo "Error: vietnam_stock_database.xlsx file missing!"
            exit 1
          else
            echo "Excel and CSV datasets generated successfully!"
          fi

      - name: Commit and push changes directly to main
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Cấu hình lại remote để cấp token quyền ghi trực tiếp
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          
          # Thêm các tệp dữ liệu vào git
          git add vietnam_stock_database.xlsx data/vietnam_stock_database_tong_hop.csv || true
          
          git status
          git diff --staged --quiet || git commit -m "Auto-update FINEX unified dataset (2020-2026) [skip ci]"
          
          # Đẩy thẳng code và dữ liệu lên nhánh main
          git push origin main
