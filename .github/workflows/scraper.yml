name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-scraper:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check and install core dependencies
        run: |
          python -m pip install --upgrade pip
          echo "Checking installed libraries..."
          pip list
          echo "Installing/Upgrading required packages..."
          pip install --upgrade pandas requests yfinance sqlite3 || true
          pip list

      - name: Run main script with error catching
        run: |
          python main.py

      - name: Verify database generated
        run: |
          ls -la
          if [ ! -f "vietnam_stock_database.db" ]; then
            echo "Error: vietnam_stock_database.db file missing!"
            exit 1
          else
            echo "Database generated successfully!"
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add vietnam_stock_database.db || true
          git diff --staged --quiet || git commit -m "Auto-update FINEX SQLite database [skip ci]"
          git push || echo "No changes to push"
