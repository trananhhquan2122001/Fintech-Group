# ============================================================================
# Financial Data Scraper Pipeline — v20.1 (Bỏ VNDirect BCTC lỗi + Đa luồng)
# ============================================================================
# ✅ Bỏ qua hoàn toàn nhánh VNDirect BCTC (HTTP 500 / Timeout / ConnectionError)
# ✅ Đa luồng (ThreadPoolExecutor) quét Quý qua yfinance -> chạy nhanh, chống kẹt
# ✅ Khử trùng lặp nhanh + Ép số chuẩn (không .0 thừa, tự điền Năm từ Ngày kỳ)
# ✅ Loại bỏ dòng trống & Giá trị == 0; xóa _checkpoint.csv; chỉ commit 2 đường dẫn Git
# ✅ Đồng bộ HuggingFace Space & Supabase batch vectorized
# ============================================================================
name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'   # 00:00 giờ Việt Nam (UTC+7)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            **/requirements*.txt

      - name: Install Dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            "yfinance>=0.2.40" \
            "pandas>=2.2" \
            "numpy>=1.26" \
            "pyarrow>=16" \
            "httpx[http2]>=0.27" \
            "tenacity>=8.3" \
            "huggingface_hub>=0.24" \
            "supabase>=2.5" \
            "vnfinancialdata>=0.1.2" \
            "openpyxl>=3.1" \
            "tqdm>=4.66" \
            "cloudscraper>=1.2.71"

      # ==========================================
      # 1. Diagnostic nhanh các nguồn hoạt động
      # ==========================================
      - name: Diagnostic Sources
        run: |
          python -c "
          import yfinance as yf
          from concurrent.futures import ThreadPoolExecutor

          def check_sym(sym):
              try:
                  t = yf.Ticker(sym)
                  q_is = t.quarterly_income_stmt
                  c_is = 0 if q_is is None or q_is.empty else q_is.size
                  return f'✅ {sym}: Q_IS={c_is}'
              except Exception as e:
                  return f'⚠️ {sym}: {type(e).__name__}'

          with ThreadPoolExecutor(max_workers=3) as ex:
              for line in ex.map(check_sym, ['FPT.VN', 'ACB.VN', 'VNM.VN']):
                  print(line)
          "

      # ==========================================
      # 2. Chạy FINEX Engine (tắt hẳn VNDirect / VNDIRECT_BCTC)
      # ==========================================
      - name: Run FINEX Engine
        env:
          SKIP_VNDIRECT: "true"
          SKIP_VNDIRECT_BCTC: "true"
          DISABLE_VNDIRECT: "true"
          RUN_VNDIRECT_BCTC: "false"
          PUSH_TO_SUPABASE: "false"
          USE_YFINANCE: "true"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          echo "🚀 Starting FINEX Engine (skip VNDirect BCTC)..."
          timeout 1200 python main.py || {
            code=$?
            echo "⚠️ Engine dừng với mã thoát: $code"
            exit 1
          }
          echo "✅ FINEX Engine finished."

      # ==========================================
      # 2b. Quét dữ liệu Quý đa luồng cho danh sách mã
      # ==========================================
      - name: Fetch Quarterly Statements (Multi-threaded)
        run: |
          set -e
          python -c "
          import os, glob, time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import pandas as pd
          import numpy as np
          import yfinance as yf

          t0 = time.time()
          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          if not os.path.exists(csv_path):
              raise FileNotFoundError(f'Không tìm thấy {csv_path}')

          df = pd.read_csv(csv_path, low_memory=False)
          cols = list(df.columns)

          ticker_set = set()
          if 'Mã chứng khoán' in df.columns:
              ticker_set.update(
                  df['Mã chứng khoán'].dropna().astype(str).str.strip().str.upper().tolist()
              )
          for p in glob.glob('**/*.csv', recursive=True) + glob.glob('**/*.txt', recursive=True):
              base = os.path.basename(p).lower()
              if any(k in base for k in ['ticker', 'stock', 'danh_sach', '176', 'vn100', 'vn30']):
                  try:
                      if p.endswith('.txt'):
                          with open(p, 'r', encoding='utf-8', errors='ignore') as f:
                              for line in f:
                                  tok = line.strip().upper()
                                  if 2 <= len(tok) <= 6 and tok.isalnum():
                                      ticker_set.add(tok)
                      else:
                          tdf = pd.read_csv(p, low_memory=False)
                          for c in ['Mã chứng khoán', 'ticker', 'symbol', 'code', 'Mã']:
                              if c in tdf.columns:
                                  for v in tdf[c].dropna().astype(str).str.strip().str.upper():
                                      if 2 <= len(v) <= 6 and v.isalnum():
                                          ticker_set.add(v)
                  except Exception:
                      pass

          tickers = sorted(ticker_set)
          print(f'🎯 Quét Quý đa luồng cho {len(tickers)} mã...')

          meta_map = {}
          if 'Mã chứng khoán' in df.columns:
              for tk, grp in df.groupby(df['Mã chứng khoán'].astype(str).str.strip().str.upper()):
                  comp = grp['Tên doanh nghiệp'].dropna().iloc[0] if 'Tên doanh nghiệp' in grp.columns and not grp['Tên doanh nghiệp'].dropna().empty else ''
                  sec  = grp['Tên ngành'].dropna().iloc[0] if 'Tên ngành' in grp.columns and not grp['Tên ngành'].dropna().empty else ''
                  meta_map[tk] = (comp, sec)

          stmt_specs = [
              ('quarterly_balance_sheet', 'Bảng cân đối kế toán'),
              ('quarterly_income_stmt', 'Báo cáo kết quả kinh doanh'),
              ('quarterly_cashflow', 'Báo cáo lưu chuyển tiền tệ'),
          ]

          def fetch_one_ticker(tk):
              comp, sec = meta_map.get(tk, ('', ''))
              rows = []
              try:
                  yf_tk = yf.Ticker(f'{tk}.VN')
                  for attr, rep_name in stmt_specs:
                      tbl = getattr(yf_tk, attr, None)
                      if tbl is None or getattr(tbl, 'empty', True):
                          continue
                      for col_dt in tbl.columns:
                          dt_obj = pd.to_datetime(col_dt, errors='coerce')
                          if pd.isna(dt_obj):
                              continue
                          q_num = (dt_obj.month - 1) // 3 + 1
                          period_label = f'Quý {q_num}'
                          rep_date_str = dt_obj.strftime('%Y-%m-%d')
                          yr_val = int(dt_obj.year)

                          series = tbl[col_dt].dropna()
                          for item_label, val in series.items():
                              v_num = pd.to_numeric(val, errors='coerce')
                              if pd.isna(v_num) or not np.isfinite(float(v_num)) or float(v_num) == 0.0:
                                  continue
                              row = {c: '' for c in cols}
                              if 'Mã chứng khoán' in row: row['Mã chứng khoán'] = tk
                              if 'Tên doanh nghiệp' in row: row['Tên doanh nghiệp'] = comp
                              if 'Tên ngành' in row: row['Tên ngành'] = sec
                              if 'Loại báo cáo' in row: row['Loại báo cáo'] = rep_name
                              if 'Loại kỳ' in row: row['Loại kỳ'] = period_label
                              if 'Năm' in row: row['Năm'] = yr_val
                              if 'Ngày kỳ' in row: row['Ngày kỳ'] = rep_date_str
                              if 'Chỉ tiêu tiếng Việt' in row: row['Chỉ tiêu tiếng Việt'] = str(item_label).strip()
                              if 'Giá trị' in row: row['Giá trị'] = float(v_num)
                              rows.append(row)
              except Exception:
                  pass
              return tk, rows

          q_rows = []
          matched = 0
          done = 0
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(fetch_one_ticker, tk) for tk in tickers]
              for fut in as_completed(futures):
                  done += 1
                  _, r_list = fut.result()
                  if r_list:
                      matched += 1
                      q_rows.extend(r_list)
                  if done % 40 == 0 or done == len(tickers):
                      print(f'  ⚡ {done}/{len(tickers)} mã | Có Quý: {matched} mã | Dòng Quý: {len(q_rows):,} ({time.time()-t0:.1f}s)')

          if q_rows:
              df_q = pd.DataFrame(q_rows)[cols]
              dedup_cols = [c for c in ['Mã chứng khoán', 'Loại báo cáo', 'Loại kỳ', 'Ngày kỳ', 'Chỉ tiêu tiếng Việt'] if c in df.columns]
              if dedup_cols:
                  existing_keys = set(zip(*(df[c].astype(str).str.strip() for c in dedup_cols)))
                  q_keys = list(zip(*(df_q[c].astype(str).str.strip() for c in dedup_cols)))
                  keep_mask = [k not in existing_keys for k in q_keys]
                  df_q = df_q[keep_mask]
              if len(df_q) > 0:
                  df = pd.concat([df, df_q], ignore_index=True)
                  df.to_csv(csv_path, index=False)
                  print(f'✅ Gộp thêm {len(df_q):,} dòng Quý mới trong {time.time()-t0:.1f}s')
          else:
              print(f'ℹ️ Không có dòng Quý mới từ yfinance ({time.time()-t0:.1f}s)')
          "

      # ==========================================
      # 2c. Làm sạch dữ liệu, ép số chuẩn & tự điền Năm
      # ==========================================
      - name: Clean Data & Format Numbers
        run: |
          set -e
          python -c "
          import os
          import numpy as np
          import pandas as pd

          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          pq_path  = 'data/vietnam_stock_database.parquet'

          if not os.path.exists(csv_path):
              raise FileNotFoundError(f'Không tìm thấy {csv_path}')

          df = pd.read_csv(csv_path, low_memory=False)
          before_rows = len(df)
          df = df.dropna(how='all')

          if 'Giá trị' in df.columns:
              val_num = pd.to_numeric(df['Giá trị'], errors='coerce')
              mask = val_num.notna() & (val_num != 0) & np.isfinite(val_num)
              df = df[mask].copy()
              val_clean = val_num[mask]

              if np.all(np.isclose(val_clean, np.round(val_clean), atol=1e-9)):
                  df['Giá trị'] = np.round(val_clean).astype('int64')
              else:
                  def fmt_num(x):
                      if np.isclose(x, round(x), atol=1e-9):
                          return str(int(round(x)))
                      return f'{x:.6f}'.rstrip('0').rstrip('.')
                  df['Giá trị'] = [fmt_num(v) for v in val_clean]

          if 'Năm' in df.columns and 'Ngày kỳ' in df.columns:
              yr_num = pd.to_numeric(df['Năm'], errors='coerce')
              dt_parsed = pd.to_datetime(df['Ngày kỳ'], errors='coerce')
              missing_yr = yr_num.isna() & dt_parsed.notna()
              if missing_yr.any():
                  df.loc[missing_yr, 'Năm'] = dt_parsed.loc[missing_yr].dt.year.astype('int64')
              yr_final = pd.to_numeric(df['Năm'], errors='coerce')
              df.loc[yr_final.notna(), 'Năm'] = yr_final.loc[yr_final.notna()].astype('int64')

          for col in ['Mã chứng khoán', 'Chỉ tiêu tiếng Việt']:
              if col in df.columns:
                  s = df[col].astype(str).str.strip()
                  df = df[(s != '') & (s.str.upper() != 'NAN') & (s.str.upper() != 'NONE')]

          after_rows = len(df)
          df.to_csv(csv_path, index=False)
          df.to_parquet(pq_path, index=False)

          csv_mb = os.path.getsize(csv_path) / 1024 / 1024
          print(f'🧹 Làm sạch: {before_rows:,} -> {after_rows:,} dòng | CSV: {csv_mb:.2f} MB')
          "

      # ==========================================
      # 3. Verify chất lượng dữ liệu
      # ==========================================
      - name: Verify Data Quality
        run: |
          set -e
          python -c "
          import pandas as pd
          import os, sys

          csv_path = 'data/vietnam_stock_database_tong_hop.csv'
          pq_path  = 'data/vietnam_stock_database.parquet'

          if not os.path.exists(csv_path):
              print('❌ Không tìm thấy file CSV')
              sys.exit(1)

          df = pd.read_csv(csv_path, low_memory=False)
          total = len(df)
          tickers = df['Mã chứng khoán'].nunique() if 'Mã chứng khoán' in df.columns else 0
          print(f'📊 Tổng dòng sạch: {total:,} | Số mã: {tickers}')

          required = ['Mã chứng khoán', 'Loại kỳ', 'Năm', 'Chỉ tiêu tiếng Việt', 'Giá trị']
          missing = [c for c in required if c not in df.columns]
          if missing:
              print(f'❌ Thiếu cột bắt buộc: {missing}')
              sys.exit(1)

          val_num = pd.to_numeric(df['Giá trị'], errors='coerce')
          null_count = int(val_num.isna().sum())
          zero_count = int((val_num == 0).sum())
          print(f'🔍 Kiểm tra sạch: null={null_count} | zero={zero_count}')

          if null_count > 0 or zero_count > 0:
              print('❌ Vẫn còn dòng trống hoặc giá trị bằng 0')
              sys.exit(1)

          if total < 80000 or tickers < 160:
              print(f'❌ Dữ liệu quá ít (dòng={total}, mã={tickers})')
              sys.exit(1)

          csv_mb = os.path.getsize(csv_path) / 1024 / 1024
          print(f'📄 CSV: {csv_mb:.1f} MB')
          if csv_mb >= 99.0:
              print('❌ File CSV vượt ngưỡng an toàn 99 MB của GitHub')
              sys.exit(1)

          if os.path.exists(pq_path):
              print(f'💾 Parquet: {os.path.getsize(pq_path)/1024/1024:.1f} MB')

          print('✅ DỮ LIỆU SẠCH & ĐẠT CHUẨN CHẤT LƯỢNG')
          "

      # ==========================================
      # 4. Chuẩn bị đúng 2 đường dẫn lưu GitHub & Commit
      # ==========================================
      - name: Prepare Git paths & clean bad commit
        run: |
          set -e
          if git log -1 --pretty=%s | grep -q "Auto-update FINEX Dataset"; then
            git reset --soft HEAD~1
            git reset HEAD 2>/dev/null || true
          fi
          rm -f data/_checkpoint.csv data/bao_cao_*.csv
          echo "COMMIT_TS=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"

      - name: Commit & Push Dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update FINEX Dataset ${{ env.COMMIT_TS }} [skip ci]"
          file_pattern: "data/*.csv data/*.parquet"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_options: "--no-verify"

      # ==========================================
      # 5. Upload HuggingFace
      # ==========================================
      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          python -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ['HF_TOKEN'])
          file_path = 'data/vietnam_stock_database.parquet'
          if not os.path.exists(file_path):
              raise FileNotFoundError(file_path)

          print('⬆️ Uploading to HuggingFace Space...')
          api.upload_file(
              path_or_fileobj=file_path,
              path_in_repo='du_lieu/dulieu_hang_ngay.parquet',
              repo_id='trananhquan2001/trananhquan-terminal',
              repo_type='space',
          )
          print('✅ HuggingFace upload thành công')
          "

      # ==========================================
      # 6. Đồng bộ Supabase (vectorized)
      # ==========================================
      - name: Sync to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -e
          python -c "
          import os, sys
          import pandas as pd
          from datetime import datetime
          from supabase import create_client

          print('--- SUPABASE SYNC (vectorized) ---')
          sb = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])

          df = pd.read_csv('data/vietnam_stock_database_tong_hop.csv', low_memory=False)

          col_map = {
              'Mã chứng khoán': 'ticker',
              'Tên doanh nghiệp': 'company_name',
              'Tên ngành': 'sector',
              'Loại báo cáo': 'report_type',
              'Loại kỳ': 'period_type',
              'Năm': 'year',
              'Ngày kỳ': 'report_date',
              'Chỉ tiêu tiếng Việt': 'item_vn',
              'Giá trị': 'value'
          }
          df = df.rename(columns={k: v for k, v in col_map.items() if k in df.columns})

          df = df.dropna(subset=['ticker', 'value'])
          df['ticker'] = df['ticker'].astype(str).str.strip().str.upper()
          df = df[df['ticker'] != 'NAN']
          df['value'] = pd.to_numeric(df['value'], errors='coerce')
          df = df.dropna(subset=['value'])
          df = df[df['value'] != 0]
          df['year'] = pd.to_numeric(df.get('year'), errors='coerce').fillna(datetime.now().year).astype(int)

          for col in ['company_name', 'sector', 'report_type', 'period_type', 'report_date', 'item_vn']:
              if col in df.columns:
                  df[col] = df[col].astype(str).replace(['nan', 'NaN', 'None'], None)

          records = df.to_dict('records')
          total = len(records)
          print(f'📦 Chuẩn bị upsert {total:,} bản ghi...')

          batch_size = 800
          for i in range(0, total, batch_size):
              batch = records[i:i+batch_size]
              try:
                  sb.table('finex_stock_master').upsert(
                      batch,
                      on_conflict='ticker,report_type,period_type,report_date,item_vn'
                  ).execute()
                  print(f'  ✅ {min(i+batch_size, total):,}/{total:,}')
              except Exception as e:
                  print(f'  ❌ Lỗi batch {i}: {e}')
                  sys.exit(1)

          print('🎉 Supabase sync hoàn tất!')
          "

      # ==========================================
      # 7. Báo cáo cuối
      # ==========================================
      - name: Final Report
        if: always()
        run: |
          echo "=============================================="
          echo "  FINEX Pipeline v20.1 (Bỏ VNDirect BCTC + Nhanh)"
          echo "=============================================="
          ls -lh data/*.parquet data/*.csv 2>/dev/null || echo "⚠️ Không có file data"
