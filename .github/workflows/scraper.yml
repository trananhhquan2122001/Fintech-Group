name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

# 🚀 CƠ CHẾ TỰ HỦY BẢN CŨ NẾU BỊ TREO
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # Tự động sập sau 25 phút
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas requests yfinance openpyxl huggingface_hub supabase numpy pyarrow
          pip install --no-cache-dir --extra-index-url https://vnstocks.com/api/packages vnstock
          pip install --no-cache-dir vnfinancialdata

      - name: Run FINEX Engine (With OS Timeout)
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSH_TO_SUPABASE: "true"
        # Dùng lệnh timeout của Linux để ép chết tiến trình sau 15 phút
        run: |
          timeout 900 python main.py || echo "⚠️ Đã hết 15 phút, ép dừng để lưu dữ liệu!"

      - name: Commit and push changes to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          git add data/ || true
          git diff --staged --quiet || git commit -m "Auto-update FINEX Dataset (Cleaned) [skip ci]"
          git push origin main

      - name: Push Cleaned Dataset to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          try:
              api.upload_file(
                  path_or_fileobj='data/vietnam_stock_database.parquet',
                  path_in_repo='du_lieu/dulieu_hang_ngay.parquet',
                  repo_id='trananhquan2001/trananhquan-terminal',
                  repo_type='space',
                  token=os.environ['HF_TOKEN']
              )
              print('Đã đẩy file Parquet thành công!')
          except Exception as e:
              print('Lỗi đẩy HuggingFace:', e)
          "
