name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *' # Chạy lúc 00:00 giờ Việt Nam

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # BẮT BUỘC phải có pyarrow để đọc/ghi file parquet
          pip install --no-cache-dir pandas requests yfinance openpyxl huggingface_hub supabase numpy pyarrow
          pip install --no-cache-dir --extra-index-url https://vnstocks.com/api/packages vnstock
          pip install --no-cache-dir vnfinancialdata

      # ==========================================
      # BƯỚC 1: CHẠY ENGINE (Cào + Lọc VAS + Xuất CSV & Parquet)
      # ==========================================
      - name: Run FINEX Engine v7.0
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSH_TO_SUPABASE: "true" # Bật cờ này để đẩy thẳng lên Supabase từ code Python
        run: python main.py

      # ==========================================
      # BƯỚC 2: LƯU FILE CSV LÊN GITHUB (BACKUP)
      # ==========================================
      - name: Commit and push changes to GitHub (Backup CSV)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          git add data/ || true
          git diff --staged --quiet || git commit -m "Auto-update FINEX Dataset (CSV & Parquet) [skip ci]"
          git push origin main

      # ==========================================
      # BƯỚC 3: ĐẨY FILE PARQUET LÊN HUGGING FACE SPACE
      # ==========================================
      - name: Push Parquet to Hugging Face Space Repo
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          
          api = HfApi()
          space_repo_id = 'trananhquan2001/trananhquan-terminal'
          
          print('Đang upload file Parquet siêu nén lên Space...')
          api.upload_file(
              path_or_fileobj='data/vietnam_stock_database.parquet',
              path_in_repo='du_lieu/dulieu_hang_ngay.parquet',
              repo_id=space_repo_id,
              repo_type='space',
              token=os.environ['HF_TOKEN']
          )
          print('Đã đẩy file Parquet thành công!')
          "
