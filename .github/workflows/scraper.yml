# ============================================================================
# Financial Data Scraper Pipeline — v17.0 (FIXED & STABLE)
# ============================================================================
# ✅ Sửa tất cả cảnh báo Node 20/Ubuntu 26
# ✅ Tăng timeout từ 12 phút → 90 phút
# ✅ Bỏ vnstock (đã hỏng API) + thêm cloudscraper (bypass firewall)
# ✅ SKIP_VNDIRECT=true (vì API bị chặn trên GitHub Actions)
# ✅ Fail-Fast khi HF upload lỗi (không nuốt lỗi)
# ✅ Verify data trước khi commit
# ============================================================================
name: Financial Data Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'   # 00:00 giờ VN

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-24.04          # ✅ Tránh cảnh báo Ubuntu 26
    timeout-minutes: 90            # ✅ Từ 25 → 90 phút
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # ✅ Hỗ trợ Node 24
        with:
          fetch-depth: 0            # ✅ Cần cho git push

      - name: Set up Python 3.11
        uses: actions/setup-python@v6   # ✅ Hỗ trợ Node 24
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            pandas requests yfinance openpyxl huggingface_hub \
            supabase numpy pyarrow vnfinancialdata cloudscraper

      # ==========================================
      # KIỂM TRA API TRƯỚC KHI CHẠY
      # ==========================================
      - name: Test VNDirect API (Diagnostic)
        run: |
          echo "=== TEST VNDIRECT API ==="
          python -c "
          import requests
          session = requests.Session()
          session.headers.update({'User-Agent': 'Mozilla/5.0 Chrome/122.0.0.0'})
          try:
              url = 'https://api-finfo.vndirect.com.vn/v4/financial_statements?q=code:ACB~reportType:QUARTER~financialStatement:BALANCE_SHEET&size=5'
              r = session.get(url, timeout=15)
              print(f'Status: {r.status_code}')
              print(f'Body preview: {r.text[:200]}')
              if r.status_code == 200:
                  print('✅ VNDIRECT API OK - sẽ chạy BCTC Quý')
              else:
                  print('⚠️ VNDIRECT API BLOCKED - sẽ chỉ chạy Năm')
          except Exception as e:
              print(f'❌ VNDIRECT ERROR: {e}')
          "
        continue-on-error: true

      # ==========================================
      # CHẠY SCRAPER CHÍNH
      # ==========================================
      - name: Run FINEX Engine
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          SKIP_VNDIRECT: "true"      # ✅ Bỏ VNDirect trên GH Actions (bị chặn IP)
          PUSH_TO_SUPABASE: "false"  # ✅ Supabase xử lý ở bước riêng
        run: |
          # ✅ Timeout 90 phút (5400s)
          timeout 5400 python main.py || echo "⚠️ Đã hết 90 phút, ép dừng!"

      # ==========================================
      # VERIFY DATA (Kiểm tra trước khi commit)
      # ==========================================
      - name: Verify Data Volume
        run: |
          echo "=== KIỂM TRA DỮ LIỆU ==="
          if [ ! -f "data/vietnam_stock_database_tong_hop.csv" ]; then
            echo "❌ KHÔNG CÓ FILE CSV! main.py chưa chạy xong!"
            exit 1
          fi
          python -c "
          import pandas as pd, os
          df = pd.read_csv('data/vietnam_stock_database_tong_hop.csv')
          print(f'Tổng dòng: {len(df):,}')
          print(f'Số mã: {df[\"Mã chứng khoán\"].nunique()}')
          print('Phân bố Loại kỳ:')
          print(df['Loại kỳ'].value_counts().to_string())
          pq_size = os.path.getsize('data/vietnam_stock_database.parquet') / 1024 / 1024
          print(f'Parquet size: {pq_size:.2f} MB')
          if len(df) < 100000:
              print(f'❌ CHỈ CÓ {len(df)} DÒNG - QUÁ ÍT!')
              raise SystemExit(1)
          print(f'✅ ĐẠT {len(df):,} DÒNG!')
          "

      # ==========================================
      # COMMIT LÊN GITHUB
      # ==========================================
      - name: Commit and push to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout main || git checkout -b main
          git add data/
          if git diff --staged --quiet; then
            echo "⚠️ Không có thay đổi để commit"
            exit 0
          fi
          git commit -m "Auto-update FINEX Dataset $(date +'%Y-%m-%d %H:%M') [skip ci]"
          git push origin main
          echo "✅ Đã push lên GitHub"

      # ==========================================
      # PUSH LÊN HUGGINGFACE (FAIL-FAST)
      # ==========================================
      - name: Push to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os, sys
          
          api = HfApi()
          space_repo_id = 'trananhquan2001/trananhquan-terminal'
          
          print(f'Upload Parquet vào Space: {space_repo_id}...')
          try:
              api.upload_file(
                  path_or_fileobj='data/vietnam_stock_database.parquet',
                  path_in_repo='du_lieu/dulieu_hang_ngay.parquet',
                  repo_id=space_repo_id,
                  repo_type='space',
                  token=os.environ['HF_TOKEN']
              )
              print('✅ Upload HuggingFace THÀNH CÔNG!')
          except Exception as e:
              print(f'❌ Upload HF THẤT BẠI: {e}')
              sys.exit(1)
          "

      # ==========================================
      # ĐỒNG BỘ SUPABASE
      # ==========================================
      - name: Push to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os
          import pandas as pd
          from datetime import datetime
          from supabase import create_client

          print('--- ĐỒNG BỘ SUPABASE ---')
          supabase = create_client(os.environ['SUPABASE_URL'], os.environ['SUPABASE_KEY'])

          file_path = 'data/vietnam_stock_database_tong_hop.csv'
          if not os.path.exists(file_path):
              print('❌ Không có file CSV'); exit(1)

          df = pd.read_csv(file_path)
          rename_map = {
              'Mã chứng khoán': 'ticker', 'Tên doanh nghiệp': 'company_name',
              'Tên ngành': 'sector', 'Loại báo cáo': 'report_type',
              'Loại kỳ': 'period_type', 'Năm': 'year', 'Ngày kỳ': 'report_date',
              'Chỉ tiêu tiếng Việt': 'item_vn', 'Giá trị': 'value'
          }
          df = df.rename(columns=rename_map)
          df = df.dropna(subset=['ticker', 'value'])
          df['ticker'] = df['ticker'].astype(str).str.strip().str.upper()
          df = df[df['ticker'] != 'NAN']
          df['value'] = pd.to_numeric(df['value'], errors='coerce')
          df = df[df['value'].notna()]
          df['year'] = pd.to_numeric(df['year'], errors='coerce').fillna(datetime.now().year).astype(int)

          records = []
          for _, row in df.iterrows():
              def cs(s): return str(s).strip() if pd.notna(s) else None
              records.append({
                  'ticker': str(row['ticker']), 'company_name': cs(row.get('company_name')),
                  'sector': cs(row.get('sector')), 'report_type': cs(row.get('report_type')),
                  'period_type': cs(row.get('period_type')), 'year': int(row['year']),
                  'report_date': cs(row.get('report_date')), 'item_vn': cs(row.get('item_vn')),
                  'value': float(row['value'])
              })

          print(f'Đồng bộ {len(records)} bản ghi...')
          for i in range(0, len(records), 500):
              batch = records[i:i + 500]
              supabase.table('finex_stock_master').upsert(
                  batch,
                  on_conflict='ticker,report_type,period_type,report_date,item_vn'
              ).execute()
              print(f'  ✅ {min(i+500, len(records))}/{len(records)}')
          print('🎉 Supabase DONE!')
          "

      # ==========================================
      # BÁO CÁO CUỐI
      # ==========================================
      - name: Final Report
        if: always()
        run: |
          echo "============================================"
          echo "  HOÀN TẤT WORKFLOW v17.0"
          echo "============================================"
          if [ -f "data/vietnam_stock_database.parquet" ]; then
            ls -lh data/vietnam_stock_database.parquet
          fi
